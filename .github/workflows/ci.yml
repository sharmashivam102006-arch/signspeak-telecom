# SignSpeak Telecom CI — backend tests + frontend build/tests.
#
# Runs on every push and pull request.
#
# Known CI limitation: the backend test `test_voice_agent_lifecycle` is
# skipped (not failed) because the voice agent needs a reachable LiveKit
# server to join a room, which sandboxed CI runners do not provide. The
# same applies to any test that needs live media: signalling and tokens
# are exercised, but remote video/audio can only be verified on a real
# network — see backend/livekit-dev.md §7.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (CPU torch)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch wheel: the default PyPI wheel is CUDA.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          ENVIRONMENT: development
          # Tests use a throwaway SQLite DB; LiveKit creds are NOT needed
          # (unconfigured LiveKit returns honest 503s, not failures).
          SECRET_KEY: ci-test-secret-not-for-production
        run: python -m pytest tests/test_api.py -v

  frontend:
    name: Frontend build + tests (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Build frontend
        working-directory: frontend
        run: npm run build
